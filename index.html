<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo de agenda digital</title>
<meta name="description" content="Demo de agenda digital de citas para negocios: veterinaria, tatuajes, casas en renta, barbería, dentista, fisioterapia y uñas.">
<meta name="theme-color" content="#14120e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda Demo">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@400;500;600&family=Poppins:ital,wght@0,600;1,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.4;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:var(--ink)}
svg{display:block}
.wrap{max-width:560px;margin:0 auto;padding-bottom:110px}
/* barra demo */
.demobar{position:sticky;top:0;z-index:30;background:#14120e;color:#f6f1e6;display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px}
.demobar .lbl{font-weight:600;letter-spacing:.14em;font-size:10.5px;background:#e8c66e;color:#14120e;border-radius:5px;padding:2px 6px}
.demobar .sp{flex:1;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demobar .vista{border:1px solid #5a5244;border-radius:99px;padding:5px 10px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.demobar .vista svg{width:14px;height:14px;color:#e8c66e}
@media (max-width:420px){.demobar .sp{visibility:hidden}}
/* encabezado */
.hdr{background:var(--hdr);color:var(--hdrInk);min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;text-align:center}
.hdr .l1{display:flex;align-items:center;gap:10px}
.hdr svg{width:26px;height:26px}
.hdr .nm{font:600 20px Poppins,sans-serif}
.hdr .tg{font-size:9px;letter-spacing:.22em;opacity:.75;margin-top:2px}
.hero{position:relative;padding:54px 18px 16px;overflow:hidden}
.pat{position:absolute;inset:0;color:var(--pri);pointer-events:none}
.pat svg{position:absolute}
.giro{position:absolute;top:12px;right:12px;z-index:2;display:flex;align-items:center;gap:6px;background:var(--surf);border:1.5px dashed var(--pri);color:var(--pri);font:600 12.5px Montserrat,sans-serif;padding:7px 12px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.giro svg{width:15px;height:15px}
.h1{position:relative}
.h1 .a{font-family:Allura,cursive;font-size:48px;line-height:.95;display:block}
.h1 .b{font:800 italic 38px/1.05 Poppins,sans-serif;color:var(--pri);display:block}
.hero p{position:relative;font-size:14px;color:var(--muted);margin:10px 0 0}
/* tarjetas y pasos */
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;margin:0 14px 12px;padding:14px}
.step.locked{opacity:.45;pointer-events:none}
.stp{display:flex;align-items:center;gap:9px;font:600 17px Poppins,sans-serif;margin-bottom:10px}
.stp i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;flex:none}
.stp small{margin-left:auto;font:500 12px Montserrat,sans-serif;color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surf);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.oscuro .chip[aria-pressed=true]{background:var(--pri);color:#140c08;border-color:var(--pri)}
.catT{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:600;margin:14px 0 2px;text-transform:uppercase}
.sv{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.catT+.sv{border-top:0}
.ill{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--pri) 14%,var(--surf));color:var(--pri)}
.ill svg{width:27px;height:27px}
.sv .t{flex:1;min-width:0}.sv b{display:block;font-weight:600;font-size:14.5px}
.sv .d{font-size:12.5px;color:var(--muted)}
.sv .m{font-size:12.5px;color:var(--muted);margin-top:1px}.sv .m b{display:inline;font-size:12.5px;color:var(--ink)}
.btn{background:var(--ink);color:var(--bg);font:600 13px Montserrat,sans-serif;border-radius:99px;padding:8px 14px;white-space:nowrap}
.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.p{background:var(--pri);color:#fff}
.btn.ok{background:#1b7446;color:#fff}.btn.bad{background:#b3261e;color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}
.oscuro .btn{background:var(--pri);color:#140c08}
.oscuro .btn.o{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.oscuro .btn[aria-pressed=true]{background:var(--pri);color:#140c08}
.btn:disabled{opacity:.4}
/* quién */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.person{border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:left;background:var(--surf)}
.person[aria-pressed=true]{border-color:var(--pri);box-shadow:0 0 0 2px color-mix(in srgb,var(--pri) 30%,transparent)}
.person .av{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:600;margin-bottom:6px}
.person b{display:block;font-size:14px;font-weight:600}.person small{font-size:11.5px;color:var(--muted)}
/* días y horas */
.days{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;border:1.5px solid var(--line);border-radius:12px;padding:7px 0;text-align:center;background:var(--surf)}
.day small{display:block;font-size:11.5px;color:var(--muted)}.day b{display:block;font:600 21px Poppins,sans-serif}
.day[aria-pressed=true]{background:color-mix(in srgb,var(--pri2) 28%,var(--surf));border-color:var(--pri2)}
.day:disabled{opacity:.4}
.slT{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:600;margin:12px 0 6px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.slot{border:1.5px solid var(--line);border-radius:10px;padding:9px 0;font-size:13.5px;font-weight:500;background:var(--surf)}
.slot:disabled{color:var(--muted);text-decoration:line-through;background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--ink) 6%,transparent) 5px 7px);opacity:.7}
.slot[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.oscuro .slot[aria-pressed=true]{background:var(--pri);color:#140c08;border-color:var(--pri)}
.empty{font-size:13.5px;color:var(--muted);padding:10px 0}
/* formulario */
.fld{margin-bottom:12px}.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 12px;font-size:15px;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--pri)}
.fld textarea{min-height:66px;resize:vertical}
.err{color:#c0392b;font-size:12.5px;margin-top:4px}
.note{display:flex;gap:9px;align-items:flex-start;background:color-mix(in srgb,var(--pri2) 20%,var(--surf));border:1px solid var(--pri2);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.note svg{width:18px;height:18px;flex:none;color:var(--pri);margin-top:1px}
.cta{display:block;width:calc(100% - 28px);margin:6px 14px 0;background:var(--ink);color:var(--bg);text-align:center;font:600 15px Montserrat,sans-serif;padding:14px;border-radius:99px}
.oscuro .cta{background:var(--pri);color:#140c08}
.cta:disabled{opacity:.4}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0}.kv span{color:var(--muted)}.kv b{font-weight:600;text-align:right}
.tot{display:flex;justify-content:space-between;font:600 16px Poppins,sans-serif;border-top:1px solid var(--line);padding-top:9px;margin-top:5px}
/* barra inferior */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg)}
.foot .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.foot b{font-weight:600;font-size:14px}.foot small{display:block;opacity:.75;font-size:12px}
.foot .btn{background:var(--pri2);color:#14120e}
/* ticket */
.ticket{border-top:5px solid var(--pri2)}
.ticket .h{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.ticket .te{font-family:Allura,cursive;font-size:40px;color:var(--pri);line-height:1}
.ticket .nm{font:800 italic 30px Poppins,sans-serif;line-height:1.05}
.ticket .box{background:color-mix(in srgb,var(--pri2) 14%,var(--surf));border-radius:12px;padding:10px 12px;margin:12px 0}
.ticket .row{display:flex;gap:10px;font-size:13.5px;padding:3px 0}.ticket .row .hr{font-weight:600;width:74px;flex:none}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#1b7446;color:#fff;font:600 14.5px Montserrat,sans-serif;padding:13px;border-radius:99px;text-decoration:none;margin-top:8px}
.wa svg{width:19px;height:19px}
/* interés */
.mio{margin:18px 14px 0;border-radius:16px;padding:16px;background:#14120e;color:#f6f1e6;display:flex;gap:12px;align-items:center}
.mio img{width:46px;height:46px;border-radius:12px;flex:none}
.mio b{display:block;font:600 15px Poppins,sans-serif}.mio small{font-size:12.5px;opacity:.8;display:block;margin-top:2px}
.mio a{margin-left:auto;background:#e8c66e;color:#14120e;font-weight:600;font-size:13px;border-radius:99px;padding:9px 13px;text-decoration:none;white-space:nowrap}
.firma{text-align:center;font-size:11.5px;color:var(--muted);margin:16px 0 0;letter-spacing:.06em}
/* hoja cambiar giro */
.over{position:fixed;inset:0;background:rgba(10,8,6,.5);z-index:40;animation:fi .2s}
.bs{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fffdf8;color:#14120e;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:su .25s;max-width:560px;margin:0 auto}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px);opacity:0}}
.bs .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:#f0ebe1;font-size:15px}
.bs .gr{width:42px;height:5px;border-radius:9px;background:#d9d2c3;margin:0 auto 12px}
.bs h3{font:600 18px Poppins,sans-serif;margin:0 0 2px}.bs p{font-size:12.5px;color:#6b6457;margin:0 0 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:13px;border:1.5px solid #ece4d4;margin-bottom:7px;text-align:left;background:#fff}
.opt .sw{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}.opt .sw svg{width:23px;height:23px}
.opt b{font-weight:600;font-size:14px;display:block}.opt small{font-size:12px;color:#6b6457}
.opt[aria-pressed=true]{border-color:#14120e;background:#f6f1e6}.opt .ck{margin-left:auto;font-weight:600}
.bs .acc{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bs .acc button{flex:1;border:1.5px solid #d9d2c3;border-radius:99px;padding:10px;font-weight:600;font-size:13px;background:#fff;min-width:140px}
.bs .ios{font-size:13px;background:#f6f1e6;border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.5}
/* toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14120e;color:#f7e8a0;padding:11px 16px;border-radius:12px;font-size:13.5px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
/* casas */
.casa{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;background:var(--surf)}
.casa[aria-pressed=true]{border-color:var(--pri);box-shadow:0 0 0 2px color-mix(in srgb,var(--pri) 30%,transparent)}
.casa .ph{height:128px;position:relative;overflow:hidden;color:#fff}
.casa .ph .big{position:absolute;left:50%;top:50%;width:70px;height:70px;transform:translate(-50%,-56%);color:rgba(255,255,255,.95)}
.casa .ph .pat svg{color:#fff}
.casa .bd{padding:12px}
.casa .bd b{font:600 18px Poppins,sans-serif}.casa .bd .d{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.casa .am{display:flex;gap:6px;flex-wrap:wrap}.casa .am span{font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.casa .pr{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.casa .pr b{font:600 17px Poppins,sans-serif}.casa .pr small{font-size:12px;color:var(--muted)}
.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mes b{font:600 16px Poppins,sans-serif;text-transform:capitalize}
.mes button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);font-size:18px}
.mes button:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .dw{font-size:10.5px;color:var(--muted);font-weight:600;padding:3px 0}
.cal button{height:42px;border-radius:9px;font-weight:500;font-size:14px;position:relative}
.cal button:disabled{color:var(--muted);opacity:.55}
.cal .oc{text-decoration:line-through;background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--ink) 7%,transparent) 4px 6px)}
.cal .in,.cal .out{background:var(--pri);color:#fff;font-weight:600;opacity:1}
.cal .in{border-radius:11px 3px 3px 11px}.cal .out{border-radius:3px 11px 11px 3px}
.cal .in.solo{border-radius:11px}
.cal .mid{background:color-mix(in srgb,var(--pri) 18%,var(--surf));border-radius:3px}
.cal small{position:absolute;bottom:2px;left:0;right:0;font-size:8.5px;font-weight:600}
.leg{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:9px;flex-wrap:wrap}
.leg span{display:inline-flex;align-items:center;gap:5px}.leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* panel */
.ptabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.ptabs button{padding:8px 10px 10px;font-weight:500;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.ptabs button[aria-pressed=true]{color:var(--ink);font-weight:600;border-color:var(--pri2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 14px 12px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:600 22px Poppins,sans-serif}.stat small{font-size:11.5px;color:var(--muted)}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:0 14px 10px}
.dnav b{font:600 15px Poppins,sans-serif;text-align:center}
.dnav button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);font-size:18px;background:var(--surf)}
.cita{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cita:first-child{border-top:0}
.cita .hr{width:68px;flex:none;font:600 14px Poppins,sans-serif;white-space:nowrap}.cita .hr small{display:block;font:500 11px Montserrat,sans-serif;color:var(--muted)}
.cita .t{flex:1;min-width:0}.cita .t b{font-weight:600}.cita .t .s{font-size:12.5px;color:var(--muted)}
.cita .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.est{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;margin-left:4px;vertical-align:1px}
.est.pendiente{background:color-mix(in srgb,var(--pri2) 30%,var(--surf))}
.est.llego{background:#d9f0e2;color:#1b7446}.est.no{background:#fbe0dd;color:#b3261e}.est.cancelada{background:#e6e3dc;color:#6b6457}
.cita.cancelada .t,.cita.cancelada .hr{opacity:.5}
.wk{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}.wk .dd{width:96px;font-weight:600}
.wk .bar{flex:1;height:10px;border-radius:9px;background:color-mix(in srgb,var(--pri) 12%,var(--surf));overflow:hidden}
.wk .bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.wk .n{width:90px;text-align:right;font-size:13px;color:var(--muted)}
.gantt{overflow-x:auto;scrollbar-width:thin}
.gantt .gh,.gantt .gr2{display:flex}
.gantt .gh div{width:34px;flex:none;text-align:center;font-size:10px;color:var(--muted)}
.gantt .gh b{display:block;font-size:12.5px;color:var(--ink)}
.gantt .gh .hoy b{color:var(--pri)}
.gantt .gn{font-size:12.5px;font-weight:600;margin:10px 0 4px}
.gantt .gr2{position:relative;height:30px;background:repeating-linear-gradient(90deg,transparent 0 33px,var(--line) 33px 34px);border-radius:6px}
.gantt .bk{position:absolute;top:3px;height:24px;border-radius:7px;background:var(--pri);color:#fff;font-size:10.5px;font-weight:600;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt .bk.llego{background:#1b7446}
.foot.panel{display:none}
@media (min-width:700px){.wrap{padding-top:10px}.hdr{border-radius:0 0 18px 18px}}
.oscuro .btn.ok{background:#1b7446;color:#fff;border-color:#1b7446}.oscuro .btn.bad{background:#b3261e;color:#fff;border-color:#b3261e}
.oscuro .foot{background:#f6ebe4;color:#14120e}

</style>
</head>
<body>
<div id="app"></div>
<noscript>Activa JavaScript para ver la demo.</noscript>
<script>
/* ====== DATOS DE CADA GIRO (todo inventado, precios aproximados) ====== */
const SVG={
 paw:'<g fill="currentColor"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.5" r="2.2"/><circle cx="14" cy="6.5" r="2.2"/><circle cx="18" cy="10" r="2.2"/></g>',
 cat:'<path fill="currentColor" d="M5 4l3.5 4.2A8 8 0 0 1 12 7.5a8 8 0 0 1 3.5.7L19 4l.6 7A7.5 7.5 0 1 1 4.4 11z"/>',
 dog:'<path fill="currentColor" d="M7 6c1.5-1.2 3.2-1.8 5-1.8s3.5.6 5 1.8l3 1.5-1 6-2-1.5V15a5 5 0 0 1-10 0v-3l-2 1.5-1-6z"/>',
 bone:'<path fill="currentColor" d="M6.5 4a2.5 2.5 0 0 1 2.4 3.2l6 6A2.5 2.5 0 1 1 18 16.4a2.5 2.5 0 1 1-2.4 3.2 2.5 2.5 0 0 1-.7-2.4l-6-6a2.5 2.5 0 1 1-3.2-2.4A2.5 2.5 0 0 1 6.5 4z"/>',

/* ---------- fechas ---------- */
const hoy0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const deIso=s=>{const[a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d)};
const sumar=(s,n)=>{const d=deIso(s);d.setDate(d.getDate()+n);return iso(d)};
const difDias=(a,b)=>Math.round((deIso(b)-deIso(a))/864e5);
const ahoraMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const hora=m=>{const h=Math.floor(m/60),mi=m%60;return `${h%12||12}:${String(mi).padStart(2,'0')} ${h<12?'am':'pm'}`};
const cap=t=>t[0].toUpperCase()+t.slice(1);
const fechaL=s=>{const d=deIso(s);return `${DIASL[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`};
const fechaC=s=>{const d=deIso(s);return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`};
const dur=m=>m<60?`${m} min`:`${Math.floor(m/60)} h${m%60?` ${m%60} min`:''}`;
const dinero=n=>'$'+Math.round(n).toLocaleString('es-MX');

/* ---------- servicios normalizados ---------- */

  if(g.svc)g.servicios=g.svc.map((s,i)=>({id:i+1,cat:s[0],ico:s[1],nombre:s[2],desc:s[3],min:s[4],precio:s[5],desde:!!s[6]}));}
const precioTxt=s=>s.precio===0?'Gratis':(s.desde?'desde ':'')+dinero(s.precio);

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let DB={};                      // datos por giro {citas:[], folio:n}
function cargar(k){const v=LS.get('dg1-'+k,null);DB[k]=v&&v.citas?v:sembrar(k);guardar(k)}
function guardar(k){LS.set('dg1-'+k,DB[k])}

/* ---------- citas de ejemplo ---------- */
function rng(seed){let s=seed%2147483647||7;return()=>(s=s*16807%2147483647)/2147483647}
function sembrar(k){
  const g=GIROS[k],r=rng(iso(hoy0()).split('-').join('')*1+k.length*97),db={citas:[],folio:1001};
  const nombre=i=>NOMBRES[(i*7+k.length)%NOMBRES.length];
  const tel=()=>'312'+String(Math.floor(r()*9e6)+1e6);
  let n=0;
  if(g.renta){
    const hoy=iso(hoy0());
    for(const c of g.casas){
      let d=sumar(hoy,-Math.floor(r()*3)-1);
      for(let j=0;j<6;j++){
        const noches=1+Math.floor(r()*4),inn=d,out=sumar(inn,noches);
        if(difDias(hoy,inn)>50)break;
        db.citas.push({folio:g.folio+'-'+db.folio++,casa:c.id,in:inn,out,noches,total:noches*c.precio,nombre:nombre(n),tel:tel(),
          extra:{huespedes:String(Math.max(1,Math.min(c.cap,2+Math.floor(r()*c.cap)))),mascota:r()<.2?'Sí':'No'},
          estado:difDias(hoy,out)<=0?'llego':(difDias(hoy,inn)<0?'llego':'pendiente'),ejemplo:1});
        n++;d=sumar(out,2+Math.floor(r()*8));
      }
    }
    return db;
  }
  const hoy=iso(hoy0()),ahora=ahoraMin();
  for(let dd=0;dd<7;dd++){
    const f=sumar(hoy,dd),h=g.horario[deIso(f).getDay()];if(!h)continue;
    const cuantas=dd===0?5:2+Math.floor(r()*3);
    for(let i=0,intent=0;i<cuantas&&intent<40;intent++){
      const s=g.servicios[Math.floor(r()*g.servicios.length)];
      const t=h[0]+Math.floor(r()*((h[1]-h[0]-s.min)/30))*30;
      const p=armarPlan(k,f,t,[s.id],null,db.citas);
      if(!p)continue;
      const fin=t+s.min;
      let estado='pendiente';
      if(dd===0&&fin<=ahora)estado=i===1?'no':'llego';
      db.citas.push({folio:g.folio+'-'+db.folio++,fecha:f,partes:p,nombre:nombre(n),tel:tel(),
        extra:g.ejemploExtra?g.ejemploExtra(n):{},estado,ejemplo:1});
      n++;i++;
    }
  }
  return db;
}

/* ---------- disponibilidad (por horas) ---------- */
const enciman=(a1,b1,a2,b2)=>a1<b2&&a2<b1;
function libre(k,fecha,staff,a,b,citas){
  return !(citas||DB[k].citas).some(c=>c.fecha===fecha&&c.estado!=='cancelada'&&c.partes.some(p=>p.staff===staff&&enciman(a,b,p.ini,p.ini+p.min)));
}
function armarPlan(k,fecha,t,ids,quien,citas){
  const g=GIROS[k],h=g.horario[deIso(fecha).getDay()];if(!h)return null;
  let cur=t;const partes=[];
  for(const id of ids){
    const s=g.servicios.find(x=>x.id===id);
    const cands=g.personal.filter(p=>(!quien||p.id===quien)&&p.cats.includes(s.cat));
    const ok=cands.find(p=>libre(k,fecha,p.id,cur,cur+s.min,citas));
    if(!ok||cur+s.min>h[1])return null;
    partes.push({svc:s.id,staff:ok.id,ini:cur,min:s.min});cur+=s.min;
  }
  return partes;
}
function horarios(k,fecha,ids,quien){
  const g=GIROS[k],h=g.horario[deIso(fecha).getDay()];if(!h)return[];
  const total=ids.reduce((a,id)=>a+g.servicios.find(s=>s.id===id).min,0);
  const esHoy=fecha===iso(hoy0()),ya=ahoraMin()+30,out=[];
  for(let t=h[0];t+total<=h[1];t+=30){
    out.push({t,libre:!(esHoy&&t<ya)&&!!armarPlan(k,fecha,t,ids,quien)});
  }
  return out;
}

/* ---------- disponibilidad (renta por noches) ---------- */
function nocheOcupada(casa,f){return DB.renta.citas.some(c=>c.casa===casa&&c.estado!=='cancelada'&&c.in<=f&&f<c.out)}
function rangoLibre(casa,a,b){for(let f=a;f<b;f=sumar(f,1))if(nocheOcupada(casa,f))return false;return true}

function vCalendario(){const g=G(),ok=!!S.casa,hoy=iso(hoy0());
  const base=S.mes||hoy.slice(0,7)+'-01',d0=deIso(base),primero=(d0.getDay()+6)%7,diasMes=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate();
  const minMes=hoy.slice(0,7)+'-01',maxMes=(()=>{const x=hoy0();x.setDate(1);x.setMonth(x.getMonth()+5);return iso(x)})();
  let cells=['L','M','M','J','V','S','D'].map(x=>`<div class="dw">${x}</div>`).join('')+'<div></div>'.repeat(primero);
  for(let i=1;i<=diasMes;i++){const f=iso(new Date(d0.getFullYear(),d0.getMonth(),i));
    let cls='',lab='',dis=false;const oc=ok&&nocheOcupada(S.casa,f);
    if(f<hoy)dis=true;
    if(S.in&&f===S.in){cls='in'+(S.out?'':' solo');lab='<small>12 pm</small>'}

    else if(S.in&&S.out&&f>S.in&&f<S.out)cls='mid';
    else if(oc){cls='oc';

      if(!(S.in&&!S.out&&f>S.in&&rangoLibre(S.casa,S.in,f)))dis=true;}
    cells+=`<button class="${cls}" data-act="dia" data-v="${f}" ${dis||!ok?'disabled':''}>${i}${lab}</button>`}
  const hint=!S.in?'Toca tu día de llegada.':!S.out?'Ahora toca tu día de salida.':'';
  return `<section class="card step ${ok?'':'locked'}" id="st3"><div class="stp"><i>2</i>Tus noches</div>
  <div class="mes"><button data-act="mes" data-v="-1" ${base<=minMes?'disabled':''} aria-label="Mes anterior">‹</button><b>${MESES[d0.getMonth()]} ${d0.getFullYear()}</b><button data-act="mes" data-v="1" ${base>=maxMes?'disabled':''} aria-label="Mes siguiente">›</button></div>

function citasDia(f){return DB[S.k].citas.filter(c=>c.fecha===f).sort((a,b)=>a.partes[0].ini-b.partes[0].ini)}
function precioCita(c){const g=G();return c.partes.reduce((a,p)=>a+g.servicios.find(s=>s.id===p.svc).precio,0)}
function botonesEstado(c){if(c.estado==='cancelada')return `<button class="btn o sm" data-act="estado" data-f="${c.folio}" data-v="pendiente">Reactivar</button>`;

const ESTADO={pendiente:'Pendiente',llego:'Llegó',no:'No llegó',cancelada:'Cancelada'};
function vPanelHoras(){const g=G(),hoy=iso(hoy0());

  if(S.pTab==='semana'){const dias=[];for(let i=0;i<7;i++)dias.push(sumar(hoy,i));
    const datos=dias.map(f=>{const cs=citasDia(f).filter(c=>c.estado!=='cancelada');return{f,n:cs.length,$:cs.reduce((a,c)=>a+precioCita(c),0)}});
    const max=Math.max(1,...datos.map(d=>d.n));

    <section class="card"><div class="kv"><span>Citas en la semana</span><b>${datos.reduce((a,d)=>a+d.n,0)}</b></div><div class="kv"><span>Ingreso estimado</span><b>${dinero(datos.reduce((a,d)=>a+d.$,0))}</b></div></section>`}
  if(S.pTab==='servicios')return tabs+`<section class="card"><div class="stp">Servicios y precios</div>
    ${g.cats.map(([ck,cn])=>`<div class="catT">${cn}</div>`+g.servicios.filter(s=>s.cat===ck).map(s=>`<div class="sv"><div class="ill">${ic(s.ico)}</div><div class="t"><b>${esc(s.nombre)}</b><div class="m">${dur(s.min)} · <b>${precioTxt(s)}</b></div></div><button class="btn o sm" data-act="aviso">Editar</button></div>`).join('')).join('')}</section>
    <section class="card"><div class="stp">Equipo y horario</div>${g.personal.map(p=>`<div class="kv"><span>${esc(p.nombre)}</span><b>${esc(p.puesto)}</b></div>`).join('')}
    <div class="kv"><span>Horario</span><b>${horarioTxt(g)}</b></div></section>`;
  const f=S.pFecha,cs=citasDia(f),act=cs.filter(c=>c.estado!=='cancelada');
  return tabs+`<div class="stats"><div class="stat"><b>${act.length}</b><small>citas</small></div><div class="stat"><b>${act.filter(c=>c.estado==='llego').length}</b><small>llegaron</small></div><div class="stat"><b>${dinero(act.reduce((a,c)=>a+precioCita(c),0))}</b><small>estimado</small></div></div>
  <div class="dnav"><button data-act="pdia" data-v="-1" aria-label="Día anterior">‹</button><b>${f===hoy?'Hoy · '+fechaL(f):cap(fechaL(f))}</b><button data-act="pdia" data-v="1" aria-label="Día siguiente">›</button></div>
  <section class="card">${cs.length?cs.map(c=>{const ex=g.resumenExtra?g.resumenExtra(c.extra):'';
    return `<div class="cita ${c.estado}"><div class="hr">${hora(c.partes[0].ini)}<small>${dur(c.partes.reduce((a,p)=>a+p.min,0))}</small></div><div class="t">
    <b>${esc(c.nombre)}</b><span class="est ${c.estado}">${ESTADO[c.estado]}</span>
    <div class="s">${c.partes.map(p=>esc(g.servicios.find(s=>s.id===p.svc).nombre)+(g.personal.length>1?' · '+g.personal.find(x=>x.id===p.staff).nombre:'')).join(' + ')}</div>
    ${ex?`<div class="s">${esc(ex)}</div>`:''}<div class="s">${c.folio} · ${c.tel.replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3')}${c.ejemplo?'':' · <b style="color:var(--pri)">nueva</b>'}</div>
    <div class="acts">${botonesEstado(c)}</div></div></div>`}).join(''):`<p class="empty">${g.horario[deIso(f).getDay()]?'No hay citas este día.':'Este día el negocio está cerrado.'}</p>`}</section>`}
function horarioTxt(g){const grupos={};for(let d=1;d<=7;d++){const k=d%7,h=g.horario[k];const t=h?`${hora(h[0])}–${hora(h[1])}`:'Cerrado';(grupos[t]=grupos[t]||[]).push(DIAS[k])}
  return Object.entries(grupos).map(([t,ds])=>`${ds.length>2?ds[0]+'–'+ds[ds.length-1]:ds.join(', ')} ${t}`).join(' · ')}
function vPanelRenta(){const g=G(),hoy=iso(hoy0());
  const tabs=`<nav class="ptabs">${[['ocup','Ocupación'],['reservas','Reservaciones'],['casas','Casas']].map(t=>`<button data-act="ptab" data-v="${t[0]}" aria-pressed="${S.pTab===t[0]}">${t[1]}</button>`).join('')}</nav>`;
  const activas=DB.renta.citas.filter(c=>c.estado!=='cancelada');
  if(S.pTab==='casas')return tabs+`<section class="card"><div class="stp">Tus casas</div>${g.casas.map(c=>`<div class="sv"><div class="ill">${ic('house')}</div><div class="t"><b>${c.nombre}</b><div class="m">Hasta ${c.cap} huéspedes · <b>${dinero(c.precio)}</b> / noche</div></div><button class="btn o sm" data-act="aviso">Editar</button></div>`).join('')}
    <div class="note" style="margin-top:8px">${ic('sun')}<div>Check-in <b>12:00 pm</b> · Check-out <b>11:00 am</b> (lo cambias en la versión real).</div></div></section>`;
  if(S.pTab==='reservas'){const prox=DB.renta.citas.filter(c=>c.out>=hoy).sort((a,b)=>a.in<b.in?-1:1);
    return tabs+`<section class="card"><div class="stp">Próximas llegadas</div>${prox.map(c=>{const k=casa(c.casa);return `<div class="cita ${c.estado}"><div class="hr">${fechaC(c.in).split(' ').slice(1).join(' ')}<small>${c.noches} noche${c.noches>1?'s':''}</small></div><div class="t"><b>${esc(c.nombre)}</b><span class="est ${c.estado}">${c.in<=hoy&&c.estado==='llego'?'Hospedado':ESTADO[c.estado]}</span>
    <div class="s">${k.nombre} · ${c.extra.huespedes} huésp.${c.extra.mascota==='Sí'?' · mascota':''}</div><div class="s">${fechaC(c.in)} 12 pm → ${fechaC(c.out)} 11 am · ${dinero(c.total)}</div><div class="s">${c.folio}${c.ejemplo?'':' · <b style="color:var(--pri)">nueva</b>'}</div><div class="acts">${botonesEstado(c)}</div></div></div>`}).join('')}</section>`}
  // ocupación (14 días)
  const ini=S.pIni,W=34,N=14;let head='';
  for(let i=0;i<N;i++){const f=sumar(ini,i),d=deIso(f);head+=`<div class="${f===hoy?'hoy':''}">${DIAS[d.getDay()].slice(0,2)}<b>${d.getDate()}</b></div>`}
  const fin=sumar(ini,N);
  const filas=g.casas.map(c=>{const bs=activas.filter(r=>r.casa===c.id&&r.in<fin&&r.out>ini).map(r=>{
    const a=Math.max(0,difDias(ini,r.in))*W+(r.in>=ini?W/2:0),b=Math.min(N,difDias(ini,r.out))*W+(r.out<=fin?W/2:W*0);
    return `<div class="bk ${r.estado==='llego'?'llego':''}" style="left:${a}px;width:${Math.max(18,b-a-2)}px" title="${esc(r.nombre)}">${esc(r.nombre.split(' ')[0])}</div>`}).join('');
    return `<div class="gn">${c.nombre}</div><div class="gr2" style="width:${W*N}px">${bs}</div>`}).join('');
  const lleganHoy=activas.filter(r=>r.in===hoy),salenHoy=activas.filter(r=>r.out===hoy);
  const noches=g.casas.length*N,ocup=g.casas.reduce((a,c)=>{let n=0;for(let i=0;i<N;i++)if(nocheOcupada(c.id,sumar(ini,i)))n++;return a+n},0);
  return tabs+`<div class="stats"><div class="stat"><b>${lleganHoy.length}</b><small>llegan hoy</small></div><div class="stat"><b>${salenHoy.length}</b><small>salen hoy</small></div><div class="stat"><b>${Math.round(ocup/noches*100)}%</b><small>ocupación</small></div></div>
  <div class="dnav"><button data-act="pini" data-v="-7" aria-label="Semana anterior">‹</button><b>${fechaC(ini)} – ${fechaC(sumar(ini,N-1))}</b><button data-act="pini" data-v="7" aria-label="Semana siguiente">›</button></div>
  <section class="card"><div class="gantt"><div class="gh">${head}</div>${filas}</div>

  ${lleganHoy.map(r=>`<div class="kv"><span>Llega 12:00 pm · ${casa(r.casa).nombre}</span><b>${esc(r.nombre)}</b></div>`).join('')}
  ${salenHoy.map(r=>`<div class="kv"><span>Sale 11:00 am · ${casa(r.casa).nombre}</span><b>${esc(r.nombre)}</b></div>`).join('')}</section>`}

/* ---------- render ---------- */
function render(){const g=G();tema();
  let body='';

}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function ir(id){setTimeout(()=>{const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},30)}

/* ---------- acciones ---------- */
function validar(){const g=G(),e={};
  if(S.datos.nombre.trim().length<3)e.nombre='Escribe tu nombre.';

const A={
  vista(){S.vista=S.vista==='cliente'?'panel':'cliente';scrollTo(0,0)},

  irDatos(){ir('st4')},
  extra(v,el){S.datos.extra[el.dataset.f]=v;delete S.err[el.dataset.f]},
  confirmar(){if(!validar())return;const g=G(),plan=armarPlan(S.k,S.fecha,S.hora,S.cart,S.quien);
    if(!plan){toast('Ese horario se acaba de ocupar. Elige otro.');S.hora=null;return}
    const c={folio:g.folio+'-'+DB[S.k].folio++,fecha:S.fecha,partes:plan,nombre:S.datos.nombre.trim(),tel:S.datos.tel.replace(/\D/g,''),extra:{...S.datos.extra},estado:'pendiente'};

  dia(f){if(!S.in||S.out){if(!nocheOcupada(S.casa,f)){S.in=f;S.out=null}return}
    if(f<=S.in){if(!nocheOcupada(S.casa,f))S.in=f;return}

    if(!rangoLibre(S.casa,S.in,S.out)){toast('Esas noches se acaban de ocupar.');S.in=S.out=null;return}
    const n=difDias(S.in,S.out),r={folio:'R-'+DB.renta.folio++,casa:S.casa,in:S.in,out:S.out,noches:n,total:n*c.precio,nombre:S.datos.nombre.trim(),tel:S.datos.tel.replace(/\D/g,''),extra:{mascota:'No',...S.datos.extra},estado:'pendiente'};
    DB.renta.citas.push(r);guardar('renta');S.ticket=r;scrollTo(0,0)},
  otra(){reset()},
  ptab(v){S.pTab=v},
  pdia(v){S.pFecha=sumar(S.pFecha,+v)},
  pini(v){S.pIni=sumar(S.pIni,+v)},
  irDia(v){S.pFecha=v;S.pTab='hoy'},
  estado(v,el){const c=DB[S.k].citas.find(x=>x.folio===el.dataset.f);if(c){c.estado=c.estado===v&&v!=='cancelada'?'pendiente':v;guardar(S.k)}},
  aviso(){toast('En la versión real aquí se editan precios, servicios y horarios.')},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(!f)return;if(el.tagName==='A')return void 0;
  e.preventDefault();f(el.dataset.v,el);render()});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(!el)return;
  if(el.dataset.in==='extra')S.datos.extra[el.dataset.f]=el.value;else S.datos[el.dataset.in]=el.value;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.hoja){S.hoja=false;render()}});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.instalar=e});
S.ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone;

/* ---------- arranque ---------- */
(function(){for(const k of ORDEN)cargar(k);
  const q=new URLSearchParams(location.search).get('giro'),guardado=LS.get('dg1-giro',null);
  S.k=GIROS[q]?q:(GIROS[guardado]?guardado:'vet');
  if(new URLSearchParams(location.search).get('vista')==='panel')S.vista='panel';
  reset();render();
  const _r=render;render=function(){_r();LS.set('dg1-giro',S.k)};
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
